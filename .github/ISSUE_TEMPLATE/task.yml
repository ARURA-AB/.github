name: Task
description: Create an implementation task
labels:
  - task
projects:
  - ARURA-AB/1
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be achieved, and why is it needed?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List what is included and explicitly out of scope.
      value: "- "
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true for the task to be complete.
      value: "- [ ] "
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: List automated checks, manual checks, and representative scenarios.
      value: "- "
    validations:
      required: true

  - type: dropdown
    id: risk-level
    attributes:
      label: Risk level
      description: Select an initial assessment. Do not assume Low or Medium without review.
      options:
        - Not yet assessed
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: risk-assessment
    attributes:
      label: Risk assessment
      description: What could go wrong? Consider technical, compatibility, data, privacy, authorization, and security risks, plus mitigations. State when no material risk is expected.
    validations:
      required: true
