name: Task
description: Create an implementation task
labels:
  - task
projects:
  - ARURA-AB/1
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be achieved, and why is it needed?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List what is included and explicitly out of scope.
      value: "- "
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true for the task to be complete.
      value: "- [ ] "
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: List automated checks, manual checks, and representative scenarios.
      value: "- "
    validations:
      required: true

  - type: textarea
    id: risk-assessment
    attributes:
      label: Risk assessment
      description: Identify the adverse event, score likelihood and impact under the Risk Management Policy, calculate the overall risk, and select a handling response.
      value: |
        **Adverse event:** Describe the specific harmful event and affected asset or objective.

        ### Likelihood
        **[Very unlikely/Unlikely/Somewhat likely/Likely/Very likely] ([1-5]).** Explain the score and relevant controls.

        ### Impact
        **[Very low/Low/Medium/High/Very high impact] ([1-5]).** Explain the operational, financial, legal, privacy, or reputational effect.

        **Overall: [Likelihood] × [Impact] = [score] ([Low/Medium/High]).**

        ### Handling
        **[Mitigate/Accept/Transfer/Avoid].** State the controls, owner, and reassessment trigger. Mitigate or Transfer requires a Risk Treatment Plan.
    validations:
      required: true
