name: Task
description: Create an implementation task
labels:
  - task
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Describe the task using the headings below.
      value: |
        ## Summary

        <!-- What should be achieved, and why is it needed? -->

        ## Scope

        <!-- List what is included and explicitly out of scope. -->

        -

        ## Acceptance criteria

        <!-- Replace these placeholders with observable conditions that must be true. -->

        - [ ]

        ## Test plan

        <!-- List automated checks, manual checks, and representative scenarios. -->

        -

        ## Risk assessment

        <!-- What could go wrong? Consider technical, compatibility, data, privacy, authorization, and security risks, plus mitigations. State when no material risk is expected. -->
    validations:
      required: true

  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      description: Select one. Maintainers may revise this during triage.
      options:
        - Normal
        - Feature
        - Bug Fix
        - Investigation / Performance
        - Testing / Quality
        - Testing / Configuration
        - Security / Dependency Update
        - Documentation

  - type: dropdown
    id: risk-level
    attributes:
      label: Risk level
      description: Select one. Do not assume Low or Medium without review.
      options:
        - Not yet assessed
        - Low
        - Medium
        - High
      default: 0

  - type: checkboxes
    id: components
    attributes:
      label: Components
      description: Select all affected areas.
      options:
        - label: Frontend
        - label: Backend / API
        - label: Field
        - label: Document generation
        - label: Intelligence
        - label: Infrastructure / CI
        - label: Documentation
