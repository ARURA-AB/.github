name: Task
description: Create an implementation task
labels:
  - task
body:
  - type: textarea
    id: description
    attributes:
      label: Task description
      description: Describe the task using the headings below.
      value: |
        ## Summary

        <!-- What should be achieved, and why is it needed? -->

        ## Scope

        <!-- List what is included and explicitly out of scope. -->

        -

        ## Acceptance criteria

        <!-- Replace these placeholders with observable conditions that must be true. -->

        - [ ]

        ## Test plan

        <!-- List automated checks, manual checks, and representative scenarios. -->

        -

        ## Risk assessment

        <!-- What could go wrong? Consider technical, compatibility, data, privacy, authorization, and security risks, plus mitigations. State when no material risk is expected. -->
    validations:
      required: true
